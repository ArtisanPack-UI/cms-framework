name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Test before release

    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite
          coverage: none

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        env:
          XDEBUG_MODE: off
        run: vendor/bin/pest --no-coverage

  release:
    needs: test
    runs-on: ubuntu-latest
    name: Create Release

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes from CHANGELOG
        id: changelog
        # Passed through `env:` rather than interpolated into the script body: a
        # workflow expression is substituted textually before the shell parses
        # anything, and a git tag may legally contain `;`, `|`, `$` and
        # backticks — so `VERSION=${{ … }}` inside `run:` is a command-injection
        # sink for anyone who can push a tag.
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Extracting notes for version $VERSION"

          if [ ! -f "CHANGELOG.md" ]; then
            echo "body=Release v$VERSION" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Extract the section between this version header and the next version header
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]")) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md)

          # Remove leading/trailing blank lines
          NOTES=$(echo "$NOTES" | sed '/./,$!d' | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}')

          if [ -z "$NOTES" ]; then
            NOTES="Release v$VERSION — see CHANGELOG.md for details."
          fi

          # Write to file for multi-line support
          echo "$NOTES" > release_notes.txt

      - name: Build release archive and checksum
        id: archive
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          ARCHIVE="cms-framework-${VERSION}.zip"

          # `git archive` output is byte-stable for a given tree, unlike the
          # zipball GitHub generates on demand — so a digest computed here keeps
          # describing the bytes a host downloads later.
          git archive --format=zip --prefix="cms-framework-${VERSION}/" -o "$ARCHIVE" HEAD

          # The updater installs from the release's lock rather than
          # re-resolving (#255), so an archive without composer.lock silently
          # defeats that. Fail the release instead of publishing one.
          # Listed to a file rather than piped into `grep -q`: under `pipefail`
          # an early-exiting `grep -q` can SIGPIPE `unzip` and fail the pipeline
          # on a match.
          unzip -l "$ARCHIVE" > archive_contents.txt

          if ! grep -qF "cms-framework-${VERSION}/composer.lock" archive_contents.txt; then
            echo "::error::Release archive ${ARCHIVE} does not contain composer.lock"
            exit 1
          fi

          # GitHubUpdateSource::extractChecksumFromSidecar() correlates on
          # exactly `{asset}.sha256`; a sidecar named anything else is ignored
          # by design, so this name is a contract, not a convention.
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"

          echo "archive=$ARCHIVE" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: v${{ steps.version.outputs.version }}
          body_path: release_notes.txt
          generate_release_notes: false
          files: |
            ${{ steps.archive.outputs.archive }}
            ${{ steps.archive.outputs.archive }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Packagist
        if: success()
        run: |
          curl --fail-with-body -sS -X POST \
            "https://packagist.org/api/update-package?username=${{ secrets.PACKAGIST_USERNAME }}&apiToken=${{ secrets.PACKAGIST_API_TOKEN }}" \
            -d "{\"repository\":{\"url\":\"https://github.com/${{ github.repository }}\"}}" \
            -H "Content-Type: application/json"
